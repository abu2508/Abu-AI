name: backend

# Backend CI (S1, extended in Phase 1). Runs the locked dev toolchain against the repository exactly as committed:
#   ruff       lint and format check (rules from pyproject.toml, unchanged)
#   mypy       strict type check (configuration from pyproject.toml, unchanged)
#   pytest     the whole tests/ tree against a throwaway PostgreSQL service (pgvector image, schema from the repo's init script)
#   docker     API image build and Compose validation with PLACEHOLDER values only
# Four independent jobs so one failing check never hides another. Every job is enforced: a failure fails the run.
# No LiteLLM gateway and no provider credentials: the live-gateway test keeps its existing skip (ABU_TEST_LITELLM_URL unset).
# The credentials below are throwaway values for a container that exists only for this run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/**'
      - 'core/**'
      - 'domain/**'
      - 'agents/**'
      - 'database/**'
      - 'tests/**'
      - 'infrastructure/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'
  push:
    branches: [main, 'claude/**']
    paths:
      - 'services/**'
      - 'core/**'
      - 'domain/**'
      - 'agents/**'
      - 'database/**'
      - 'tests/**'
      - 'infrastructure/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

env:
  CI: 1

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - name: Install locked dependencies (including the dev group)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - name: Install locked dependencies (including the dev group)
        run: uv sync --frozen
      - name: mypy
        run: uv run --no-sync mypy

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: abu_admin
          POSTGRES_PASSWORD: ci-admin-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abu_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGPASSWORD: ci-admin-throwaway
      POSTGRES_USER: abu_admin
      APP_DB_NAME: abu_ai
      APP_DB_USER: abu_app
      APP_DB_PASSWORD: ci-app-throwaway
      LITELLM_DB_NAME: litellm
      LITELLM_DB_USER: litellm
      LITELLM_DB_PASSWORD: ci-litellm-throwaway
      ABU_TEST_ADMIN_URL: postgresql+psycopg://abu_admin:ci-admin-throwaway@127.0.0.1:5432/postgres
      ABU_TEST_DATABASE_URL: postgresql+psycopg://abu_app:ci-app-throwaway@127.0.0.1:5432/abu_ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
      - name: Install locked dependencies (including the dev group)
        run: uv sync --frozen
      - name: PostgreSQL 16 client tools (the restore rehearsal needs pg_dump/pg_restore of the SAME major version as the server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Create the application and LiteLLM databases with the repository init script
        run: bash infrastructure/postgres/01-init.sh
      - name: pytest (whole tests/ tree)
        run: uv run --no-sync pytest -ra

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the API image
        run: >-
          docker build -f services/api/Dockerfile --target runtime
          --build-arg GIT_SHA="$GITHUB_SHA" --build-arg VERSION="ci-$GITHUB_RUN_NUMBER"
          -t abu-api:ci .
      - name: Smoke-test the image (no network, no database, no secrets)
        run: |
          docker run --rm --network none abu-api:ci python -c "import services.api.entrypoint, services.admin.__main__, database.provision; print('imports ok')"
          test "$(docker run --rm --network none abu-api:ci id -u)" = "10001"
          if docker run --rm --network none abu-api:ci python -m pip --version; then echo "pip is present in the runtime image"; exit 1; fi
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' abu-api:ci)" = "$GITHUB_SHA"
          # the guarded entrypoint refuses an unsafe production configuration (nothing is started)
          if docker run --rm --network none -e ABU_ENV=production -e ABU_JWT_SECRET=placeholder-placeholder-placeholder-00 -e ABU_TOKEN_HASH_KEY=placeholder-placeholder-placeholder-11 abu-api:ci python -c "from services.api.entrypoint import create_checked_app; create_checked_app()"; then echo "an unsafe production configuration was accepted"; exit 1; fi
      - name: Validate the Compose layers with placeholder values
        run: |
          cat > "$RUNNER_TEMP/compose-placeholder.env" <<'EOF'
          POSTGRES_ADMIN_USER=placeholder
          POSTGRES_ADMIN_PASSWORD=placeholder
          APP_DB_NAME=placeholder
          APP_DB_USER=placeholder
          APP_DB_PASSWORD=placeholder
          APP_DB_OWNER_USER=placeholder_owner
          APP_DB_OWNER_PASSWORD=placeholder
          LITELLM_DB_NAME=placeholder
          LITELLM_DB_USER=placeholder
          LITELLM_DB_PASSWORD=placeholder
          LITELLM_MASTER_KEY=sk-placeholder
          JWT_SECRET=placeholder-placeholder-placeholder-00
          TOKEN_HASH_KEY=placeholder-placeholder-placeholder-11
          ABU_DOMAIN=example.invalid
          ABU_ACME_EMAIL=ops@example.invalid
          EOF
          cd infrastructure
          E="$RUNNER_TEMP/compose-placeholder.env"
          docker compose --env-file "$E" -f docker-compose.yml config --quiet
          docker compose --env-file "$E" -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          docker compose --env-file "$E" -f docker-compose.yml -f docker-compose.hardened.yml -f docker-compose.staging.yml config --quiet
          docker compose --env-file "$E" -f docker-compose.yml -f docker-compose.hardened.yml -f docker-compose.production.yml config --quiet
      - name: Validate the Caddy configurations with the pinned Caddy image
        run: |
          CADDY=caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          docker run --rm --network none -v "$PWD/infrastructure/caddy/Caddyfile.staging:/etc/caddy/Caddyfile:ro" "$CADDY" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --network none -e ABU_DOMAIN=example.invalid -e ABU_ACME_EMAIL=ops@example.invalid -v "$PWD/infrastructure/caddy/Caddyfile.production:/etc/caddy/Caddyfile:ro" "$CADDY" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
