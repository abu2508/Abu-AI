name: mobile

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', 'tests/contracts/golden/**', '.github/workflows/mobile.yml']
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', 'tests/contracts/golden/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Scripts are disabled by .npmrc (ignore-scripts=true); the allowlist gate below verifies which packages have any.
      - run: npm ci
      - name: SDK alignment, types, lint, format, tests
        run: |
          npm run check:sdk
          npm run check:transport
          npm run check:native-gate
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:coverage
      - name: Generated API types match the committed OpenAPI snapshot
        run: npm run api:types:check
      - name: Supply-chain gates (licences, install scripts, vulnerabilities)
        run: |
          npm run check:licenses
          npm run check:install-scripts
          npm run check:audit
          npm run check:overrides
          npm run check:noxcturnal
      - name: Web export and secret scan (source + bundle)
        run: |
          npm run export:web
          npm run check:secrets
