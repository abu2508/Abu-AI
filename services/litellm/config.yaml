# Safe initial LiteLLM configuration.
#
# - No models and no provider keys: nothing here can reach a paid (or any) provider.
# - Models are added in Milestone 2+ from the application-owned Model Registry;
#   Abu AI, not LiteLLM, is the source of truth for approval and spending policy.
# - Gateway-level budget is a second line of defence behind the application ledger.
model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  telemetry: false
  drop_params: true
  # Global gateway ceiling of zero until a paid provider is explicitly opted in.
  max_budget: 0
  budget_duration: 30d
