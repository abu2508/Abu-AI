[alembic]
script_location = database/migrations
file_template = %%(rev)s_%%(slug)s
# The database URL is taken from ABU_DATABASE_URL (see database/migrations/env.py); never put it here.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
